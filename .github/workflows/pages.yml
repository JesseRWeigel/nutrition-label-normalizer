name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# The group key is the run id, deliberately, and the tradeoff runs in both directions.
#
# With `group: pages`, every deploy queues on one shared lock. A run that wedges holds that
# lock, every later push waits behind it, and a wedged run cannot always be cancelled from
# the UI, so the fix becomes an admin problem rather than a push.
#
# With `group: pages-${{ github.run_id }}` every run gets its own group and nothing queues.
# What is given up is ordering: two pushes close together run concurrently and whichever
# finishes last is the version that ends up live, which may be the older commit. The page
# here is regenerated from committed fixtures, so a temporary wrong version is fixed by the
# next push. Where publishing an older commit would do harm, the shared group and its queue
# is the right choice instead.
concurrency:
  group: pages-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No pip install step. The package is standard library only, on purpose, so there is
      # nothing here to resolve and nothing to pin.

      - name: unit tests
        run: python3 -m unittest discover -s tests -t . -v

      # The page is generated from the fixture corpus, so it is rebuilt here and diffed
      # rather than trusted. A committed docs/index.html that no longer matches what the
      # engine produces is a published page saying something the code does not.
      - name: rebuild the page and fail if the committed copy has drifted
        run: |
          python3 scripts/build_page.py
          git diff --exit-code -- docs/index.html

      - name: independent recomputation by a second implementation
        run: python3 scripts/check_independent.py

      - name: privacy scan with a positive control
        run: python3 scripts/privacy_scan.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
